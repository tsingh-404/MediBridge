[project]
name = "medibridge"
version = "0.1.0"
description = "Agentic RAG chatbot for OSHC insurance queries"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "openai>=1.50",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pymupdf>=1.24",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
# pip install -e ".[dev]"  — local/CI test and build tooling
dev = ["pytest>=8", "build>=1.0"]
# pip install -e ".[eval]"  — LangSmith eval harness (evals/, run via: python -m evals.run_eval)
eval = ["langsmith>=0.1.100"]

[project.scripts]
medibridge = "medibridge.server.main:run"
medibridge-cli = "medibridge.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
