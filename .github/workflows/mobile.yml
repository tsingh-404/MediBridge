name: mobile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  # Placeholder for CI builds; the real value is injected per-environment.
  MB_API_BASE: https://api.example.invalid

jobs:
  # ui/js, ui/vendor and ui/fonts are committed so `medibridge` runs with no Node
  # toolchain (the Dockerfile has no build stage). This job stops them drifting.
  web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run build:web
        working-directory: mobile
      - name: Committed build output must match the sources
        run: |
          git diff --exit-code -- ui/js ui/vendor ui/fonts \
            || { echo "::error::Committed web assets are stale — run 'npm run build:web' in mobile/ and commit"; exit 1; }

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -v

  android:
    runs-on: ubuntu-latest
    needs: [web-assets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: mobile
      - name: No dev-only settings in the build
        run: npm run guard
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk

  # Compile check only. Device builds and TestFlight need an Apple Developer
  # account and signing secrets, which do not exist yet.
  ios:
    runs-on: macos-latest
    needs: [web-assets]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run guard
        working-directory: mobile
      - run: npm run sync
        working-directory: mobile
      - name: Build for simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
