<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MediBridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F5F6F0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />

<!-- Self-hosted webfonts (mobile/scripts/fetch-fonts.mjs). No CDN at runtime. -->
<link rel="stylesheet" href="fonts/fonts.css" />

<style>
  /* Every colour is declared twice: an sRGB hex fallback first, then the oklch()
     original. Browsers without oklch() (Safari < 15.4, Chrome < 111) keep the
     hex; everywhere else the second declaration wins. ui/tokens.js reads these
     through var(), so inline styles inherit the same fallback behaviour. */
  :root {
    /* One neutral family: warm-grey paper. No second (cool) grey anywhere. */
    --bg: #F5F6F0;
    --surface: #FFFFFF;
    --surface-muted: #EEF0EA;
    --border: #DBE1DB;
    --border-strong: #C8D0C8;

    --ink: #131714;
    --ink-muted: #4C5A50;
    --ink-subtle: #5F6E66;

    /* One brand accent. --accent-strong is the only fill that carries white
       text (WCAG AA); --accent is for borders, glyphs and progress fills. */
    --accent: #0074a0;
    --accent: oklch(52% 0.12 230);
    --accent-strong: #005c80;
    --accent-strong: oklch(45% 0.11 230);
    --accent-soft: #dbf3ff;
    --accent-soft: oklch(95% 0.03 230);
    --accent-ink: #004264;
    --accent-ink: oklch(35% 0.1 230);

    /* Status colours are semantic only (covered / waiting / problem), never
       decoration. The -ink variants are the text-safe pair for each fill. */
    --ok: #4b8a63;
    --ok: oklch(58% 0.09 155);
    --ok-ink: #2f6b45;
    --ok-ink: oklch(46% 0.09 155);
    --ok-soft: #e5f3e9;
    --ok-soft: oklch(95% 0.02 155);

    --warn: #d49838;
    --warn: oklch(72% 0.13 75);
    --warn-ink: #8a5a12;
    --warn-ink: oklch(48% 0.1 75);
    --warn-soft: #fdf0dc;
    --warn-soft: oklch(96% 0.035 75);

    --bad: #bb5752;
    --bad: oklch(58% 0.13 25);
    --bad-ink: #9a3b36;
    --bad-ink: oklch(45% 0.13 25);
    --bad-soft: #ffebe8;
    --bad-soft: oklch(96% 0.03 25);

    --font-display: "Cabinet Grotesk", "General Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-sans: "General Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

    /* One radius scale: chips, controls, sheets. Full pills are reserved for
       the selected nav glyph, segmented toggles and progress tracks. */
    --r-chip: 8px;
    --r-control: 12px;
    --r-sheet: 16px;
    --r-pill: 999px;

    /* Shadows carry the paper hue, never pure black, and only two levels:
       a hairline lift and a dock that floats over scrolling content. */
    --shadow-1: 0 1px 2px rgba(19, 23, 20, 0.05);
    --shadow-dock: 0 -8px 24px -14px rgba(19, 23, 20, 0.22);

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --dur-fast: 140ms;
    --dur: 220ms;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  html, body, #root { height: 100%; }
  #root { width: 100%; position: relative; }
  * { box-sizing: border-box; }
  /* prevent iOS rubber-band scrolling on the shell; inner scroll containers still scroll */
  body { overscroll-behavior-y: none; }
  h1, h2, h3, h4, p { margin: 0; }
  input, button, textarea { font-family: inherit; }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--r-pill); }
</style>

<!-- Component layer. Must be copied into the native bundle too, so it is
     listed in mobile/scripts/prepare-www.mjs. -->
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>

<!-- Vendored React (ui/vendor/) — no unpkg, no in-browser Babel. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Runtime config: must precede api.js. The mobile build overwrites this file. -->
<script src="config.js"></script>

<!-- Precompiled by `npm run build:web` in mobile/. These are classic scripts that
     share globals, so the order below is load-bearing — it mirrors the original
     dependency order (tokens/api -> shell primitives -> screens -> App -> mount). -->
<script src="js/tokens.js"></script>
<script src="js/api.js"></script>
<script src="js/native.js"></script>
<script src="js/shell.js"></script>
<script src="js/screens/onboarding.js"></script>
<script src="js/screens/chat.js"></script>
<script src="js/screens/calc.js"></script>
<script src="js/screens/clinics-profile.js"></script>
<script src="js/app.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
